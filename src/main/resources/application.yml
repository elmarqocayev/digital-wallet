spring:
  application:
    name: digital-wallet-api
  datasource:
    url: jdbc:h2:mem:walletdb;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop   # schema is rebuilt on each start (dev only)
    open-in-view: false       # we map entities to DTOs inside the service layer
  h2:
    console:
      enabled: true           # http://localhost:8080/h2-console
